[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qzone-archive"
version = "0.5.1"
description = "Back up Qzone moods, photos and albums to local JSON and offline HTML"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Qzone Archive contributors"}]
keywords = ["qzone", "backup", "archive", "html", "photos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiohttp>=3.9",
  "demjson3>=3.0.6",
  "loguru>=0.7",
  "lxml>=4.9",
  "Pillow>=9.0",
  "qrcode>=7.4",
  "requests>=2.31",
]

[project.optional-dependencies]
terminal-qr = ["pyzbar>=0.9.2"]
dev = ["build>=1.2"]

[project.scripts]
qzone-archive = "main:main"

[tool.setuptools]
py-modules = ["main", "qzone_scraper"]

[tool.setuptools.packages.find]
include = ["qzone_api*"]
